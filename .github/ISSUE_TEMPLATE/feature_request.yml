name: Feature Request
description: Suggest an idea for Kiro
labels: ["pending-triage"]
body:
  - type: markdown
    attributes:
      value: |

        ## Before submitting a feature request

        Please [search open and closed issues](https://github.com/kirodotdev/Kiro/issues?q=is%3Aissue+sort%3Aupdated-desc) to see whether your idea has already been suggested. If you find a matching request, add a 👍 reaction and subscribe for updates. Add a comment if you have a new use case to share.

  - type: dropdown
    id: kiro-product
    attributes:
      label: Kiro Product
      description: Which Kiro product does this feature request apply to?
      options:
        - IDE
        - CLI
        - IDE and CLI
        - Web
        - Mobile
        - Crew
        - Autonomous Agent
        - Other / multiple products
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What problem does this solve and how should it work?
      placeholder: "Describe the challenge you're facing and your suggested feature."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would you use this feature?
      placeholder: "Provide concrete examples of when and how you'd use this."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant details
      placeholder: "Screenshots, examples, or technical details that might help."
    validations:
      required: false
